interface:
  display_name: "Sigil"
  short_description: "Author Sigil and use native scope and semantic gates"
  default_prompt: "Use $sigil. When authoring, actively use Concepts for recurring cross-contract concerns and reuse matching accessible Tags; preserve mixed ungrouped Facets and avoid redundant wrappers for small single-concern components. Inspect governing contracts, export current Design input when it changed, read the durable compilation execution reference, and use sigilc directly. Inspect scope and stale state, prepare each required source, give only its copied semantic inputs to an external interpreter, and ingest its Turtle with the unchanged binding.json. Keep scheduling, retries, interpreter records, tests, review, and delivery outside sigilc."
