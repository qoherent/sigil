      contracts: constraints and cases
      lines: "9-10, 13-14"
    evidence:
      - input_sha256: fba681678b572e29c032dd39e382f7f35102829ae1986144c9e1f019fc78c6a2
        anchor: panel.sigil:9-10
        quote: |-
          Only the active request may publish results.
          Cancelling a request immediately makes it inactive.
      - input_sha256: fba681678b572e29c032dd39e382f7f35102829ae1986144c9e1f019fc78c6a2
        anchor: panel.sigil:13-14
        quote: |-
          A cancelled request completes after its replacement starts;
          the cancelled request may publish its results.
      - input_sha256: 4b912ad8780b1967a46755eb31495a279156cf88392f4cbb40773dc085da7eed
        anchor: intent.md:1
        quote: Only the active request may publish. Cancelling immediately makes a request inactive.
    consequence: >
      The case permits publication by a request that cancellation has made
      inactive, directly contradicting the publication invariant. Following
      that permission could display results from the cancelled search after
      its replacement starts.
    priority: high
    suggestion: >
      Preserve the late-completion scenario and change its outcome to state
      that the cancelled request must not publish its results.
    disposition: determined_correction
    authorizing_commitment:
      path: /var/folders/xt/zq2r4zxd4xvdltd71g0qnf680000gn/T/sigil-mechanical-work-yfvrgp8q/observations/contradiction/workspace/intent.md
      sha256: 4b912ad8780b1967a46755eb31495a279156cf88392f4cbb40773dc085da7eed
      anchor: "line 1"
      commitment: Only the active request may publish. Cancelling immediately makes a request inactive.
      preserved_promises:
        - Publish matching records for the active request.
        - Cancellation immediately makes the request inactive.
        - Inactive requests cannot publish.
        - The case continues to cover cancelled completion after replacement starts.

