[package]
name = "sigilc"
version = "0.3.0"
edition = "2024"
rust-version = "1.91.1"
publish = false

[dependencies]
egglog = { git = "https://github.com/egraphs-good/egglog.git", rev = "90635860397ce710f8c0a4eeb04154a8ebc3ac05", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.11"
snapdir-core = { git = "https://github.com/qoherent/snapdir.git", rev = "b5e5780" }
# Keep hashing cross-compilable without platform-specific assembler tools.
blake3 = { version = "1.8.5", features = ["pure"] }

[profile.release]
opt-level = 2
